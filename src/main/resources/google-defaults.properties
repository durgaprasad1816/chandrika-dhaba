# ---------------------------------------------------------------------------------------------
#  Chandrika Dhaba - Google defaults.  KEEP THIS REPOSITORY PRIVATE: these values are secrets.
#
#  With these three values filled in, a fresh server (for example Render's free plan, which wipes
#  its disk) connects to your Google Drive by itself and restores your dishes, pictures, waiters,
#  bills and your login before the first page opens.
#
#  1. client.id / client.secret : from Google Cloud > APIs & Services > Credentials (OAuth client, Web application)
#  2. refresh.token             : run the app, sign in with Google in Settings, press "Show key for Render",
#                                 and paste the long value here (just the part after DHABA_GOOGLE_REFRESH_TOKEN=)
#  3. owner.email (optional)    : your Gmail address, only used for display
#
#  Lines starting with # are ignored. Leave a value as PASTE_... if you do not have it yet.
# ---------------------------------------------------------------------------------------------
client.id=
client.secret=
refresh.token=
owner.email=
