<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Table QR codes - Chandrika Dhaba &amp; Restaurant</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/theme.css">
<style>
  body { background: #fff; padding: 16px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .bar p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 220px; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .qcard { border: 3px solid var(--olive); border-radius: 22px; background: var(--gold); text-align: center; padding: 16px 14px 14px; break-inside: avoid; page-break-inside: avoid; }
  .qcard .nm { font-family: var(--font-display); font-size: 26px; color: var(--olive-dark); line-height: 1.1; }
  .qcard .tag { font-size: 13px; color: var(--olive-dark); margin: 2px 0 10px; }
  .qcard .qr { background: #fff; border-radius: 16px; padding: 10px; border: 3px solid var(--olive); }
  .qcard .qr svg { width: 100%; height: auto; display: block; }
  .qcard .tno { display: inline-block; background: var(--olive); color: var(--gold); font-weight: 700; font-size: 20px; padding: 4px 22px; border-radius: 999px; margin-top: 12px; }
  .qcard .url { font-size: 10.5px; color: var(--olive-dark); margin-top: 8px; word-break: break-all; opacity: .8; }
  @media print { .bar { display: none; } body { padding: 0; } .sheet { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="bar">
  <button class="btn gold" id="printBtn" type="button">Print</button>
  <p id="info">Loading...</p>
</div>
<div class="sheet" id="sheet"></div>
<script src="/js/qrcode.js"></script>
<script src="/js/qr.js"></script>
</body>
</html>
